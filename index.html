<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NoteFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">NoteFlow</div>
    <input id="searchBar" class="search" placeholder="Search…" onkeyup="if(event.key==='Enter') search()">
  </header>

  <main class="main">
    <aside class="sidebar">
      <div class="upload-box">
        <form id="uploadForm">
          <input id="uploadInput" type="file" accept="audio/*">
          <button type="submit">Upload</button>
        </form>
        <div id="uploads" class="uploads"></div>
      </div>
    </aside>

    <section class="content">
      <div id="results" class="results"></div>
      <audio id="player" controls></audio>
    </section>
  </main>

  <script src="frontend.js?v=4"></script>
</body>
</html>
